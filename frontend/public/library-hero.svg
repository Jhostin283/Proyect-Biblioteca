<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="t d">
  <title id="t">Biblioteca</title>
  <desc id="d">Estantería de madera con libros de colores y una escalera apoyada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a52"/>
      <stop offset="1" stop-color="#8f6636"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4d3f"/>
      <stop offset="1" stop-color="#163a30"/>
    </linearGradient>
  </defs>

  <rect width="520" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="96" cy="78" r="46" fill="#fbf1e2"/>
  <circle cx="440" cy="330" r="72" fill="#e8f1ed"/>

  <!-- marco de la estantería -->
  <rect x="76" y="56" width="368" height="288" rx="14" fill="url(#frame)"/>
  <rect x="92" y="72" width="336" height="256" rx="8" fill="#fbfaf7"/>

  <!-- baldas -->
  <rect x="92" y="150" width="336" height="12" fill="url(#wood)"/>
  <rect x="92" y="248" width="336" height="12" fill="url(#wood)"/>

  <!-- fila superior de libros -->
  <g>
    <rect x="112" y="86" width="22" height="62" rx="3" fill="#1f4d3f"/>
    <rect x="138" y="94" width="18" height="54" rx="3" fill="#a86b1f"/>
    <rect x="160" y="82" width="26" height="66" rx="3" fill="#8c3b2e"/>
    <rect x="190" y="98" width="16" height="50" rx="3" fill="#2d5c8a"/>
    <rect x="210" y="88" width="24" height="60" rx="3" fill="#4b6b3a"/>
    <rect x="238" y="102" width="18" height="46" rx="3" fill="#b98a52"/>
    <rect x="260" y="90" width="20" height="58" rx="3" fill="#23403a"/>
    <rect x="284" y="96" width="26" height="52" rx="3" fill="#7a4a63"/>
    <path d="M322 148 L322 96 Q334 84 346 96 L346 148 Z" fill="#2f6b5a"/>
    <rect x="352" y="92" width="18" height="56" rx="3" fill="#c08a3e"/>
    <rect x="374" y="100" width="24" height="48" rx="3" fill="#3f5f8a"/>
  </g>

  <!-- fila central -->
  <g>
    <rect x="112" y="176" width="26" height="72" rx="3" fill="#8c3b2e"/>
    <rect x="142" y="184" width="18" height="64" rx="3" fill="#1f4d3f"/>
    <rect x="164" y="172" width="22" height="76" rx="3" fill="#2d5c8a"/>
    <rect x="190" y="190" width="20" height="58" rx="3" fill="#a86b1f"/>
    <rect x="214" y="180" width="26" height="68" rx="3" fill="#4b6b3a"/>
    <rect x="244" y="188" width="16" height="60" rx="3" fill="#7a4a63"/>
    <rect x="264" y="176" width="24" height="72" rx="3" fill="#23403a"/>
    <rect x="292" y="192" width="20" height="56" rx="3" fill="#b98a52"/>
    <rect x="316" y="182" width="22" height="66" rx="3" fill="#2f6b5a"/>
    <rect x="342" y="188" width="18" height="60" rx="3" fill="#c08a3e"/>
    <rect x="364" y="178" width="26" height="70" rx="3" fill="#3f5f8a"/>
  </g>

  <!-- fila inferior con hueco -->
  <g>
    <rect x="112" y="276" width="24" height="44" rx="3" fill="#23403a"/>
    <rect x="140" y="282" width="18" height="38" rx="3" fill="#a86b1f"/>
    <rect x="162" y="272" width="22" height="48" rx="3" fill="#2d5c8a"/>
    <rect x="188" y="286" width="20" height="34" rx="3" fill="#8c3b2e"/>
    <rect x="212" y="276" width="26" height="44" rx="3" fill="#1f4d3f"/>
  </g>

  <!-- escalera -->
  <g stroke="url(#wood)" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="316" y1="96" x2="286" y2="318"/>
    <line x1="386" y1="96" x2="356" y2="318"/>
  </g>
  <g stroke="url(#wood)" stroke-width="6" stroke-linecap="round">
    <line x1="309" y1="150" x2="379" y2="150"/>
    <line x1="302" y1="200" x2="372" y2="200"/>
    <line x1="295" y1="250" x2="365" y2="250"/>
    <line x1="288" y1="300" x2="358" y2="300"/>
  </g>

  <!-- detalle: libro abierto sobre la balda -->
  <g transform="translate(120 300)">
    <path d="M0 12 Q22 0 44 12 L44 40 Q22 28 0 40 Z" fill="#fbf1e2" stroke="#c9bfae" stroke-width="2"/>
    <path d="M44 12 Q66 0 88 12 L88 40 Q66 28 44 40 Z" fill="#ffffff" stroke="#c9bfae" stroke-width="2"/>
    <line x1="44" y1="12" x2="44" y2="40" stroke="#c9bfae" stroke-width="2"/>
  </g>
</svg>
