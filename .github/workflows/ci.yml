name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main lo cubre deploy.yml, que reutiliza este workflow
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Sensores (check.sh --full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ejecutar sensores
        run: ./scripts/check.sh --full
