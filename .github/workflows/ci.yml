name: CI

# Triggers automáticos deshabilitados mientras CI/Deploy muestre errores en GitHub.
# Solo queda el lanzamiento manual (workflow_dispatch) y workflow_call (lo usa
# deploy.yml; no se ejecuta solo). Para reactivar, restaura pull_request / push.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Sensores (check.sh --full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ejecutar sensores
        run: ./scripts/check.sh --full
