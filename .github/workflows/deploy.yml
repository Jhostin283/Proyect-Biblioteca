name: Deploy

# Producción se despliega SOLO al publicar un tag de versión (v1.0.0, v1.1.0…),
# y ese tag tiene que apuntar a un commit de main. El job "guard" lo comprueba.
# workflow_dispatch queda para un despliegue manual de emergencia.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  guard:
    name: Verificar que el tag está en main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: El tag debe apuntar a un commit de main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} no apunta a un commit de main. Integra y publica primero en main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} verificado sobre main."

  # Ejecuta todo el workflow de CI: sensores + cobertura de backend y frontend.
  # Si cualquiera de sus jobs falla (incluido el umbral del 80 %), el despliegue no arranca.
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build y push a GHCR
    needs: [guard, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Nombre de imagen (GHCR exige minúsculas) y versión
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-backend:latest
            ${{ steps.vars.outputs.prefix }}-backend:${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-frontend:latest
            ${{ steps.vars.outputs.prefix }}-frontend:${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Desplegar en la EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST || secrets.EC2_IP }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      IMAGE_PREFIX: ${{ needs.build.outputs.prefix }}
      TAG: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar docker-compose.prod.yml
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'mkdir -p ~/app'
          scp -i ~/.ssh/ec2.pem docker-compose.prod.yml "$EC2_USER@$EC2_HOST:~/app/docker-compose.prod.yml"

      - name: Pull y arranque en la EC2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/app
          test -f .env || { echo "Falta ~/app/.env: revisa el user-data de Terraform o ejecuta scripts/setup-ec2.sh"; exit 1; }
          sed -i '/^IMAGE_PREFIX=/d;/^TAG=/d' .env
          echo "IMAGE_PREFIX=${IMAGE_PREFIX}" >> .env
          echo "TAG=${TAG}" >> .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Smoke test contra producción
        env:
          SMOKE_RETRIES: "40"
        run: ./scripts/smoke.sh "http://$EC2_HOST"

      - name: Logs del backend si algo falló
        if: failure()
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "cd ~/app && docker compose -f docker-compose.prod.yml logs --tail=80 backend frontend" || true
