name: Deploy

# Trigger automático de despliegue deshabilitado temporalmente hasta finalizar el proyecto.
# Solo queda el lanzamiento manual (workflow_dispatch).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build y push a GHCR
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Nombre de imagen (GHCR exige minúsculas)
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-backend:latest
            ${{ steps.vars.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-frontend:latest
            ${{ steps.vars.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Desplegar en la EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST || secrets.EC2_IP }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      IMAGE_PREFIX: ${{ needs.build.outputs.prefix }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar docker-compose.prod.yml
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'mkdir -p ~/app'
          scp -i ~/.ssh/ec2.pem docker-compose.prod.yml "$EC2_USER@$EC2_HOST:~/app/docker-compose.prod.yml"

      - name: Pull y arranque en la EC2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/app
          test -f .env || { echo "Falta ~/app/.env: revisa el user-data de Terraform o ejecuta scripts/setup-ec2.sh"; exit 1; }
          sed -i '/^IMAGE_PREFIX=/d;/^TAG=/d' .env
          echo "IMAGE_PREFIX=${IMAGE_PREFIX}" >> .env
          echo "TAG=${TAG}" >> .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Smoke test contra producción
        env:
          SMOKE_RETRIES: "40"
        run: ./scripts/smoke.sh "http://$EC2_HOST"

      - name: Logs del backend si algo falló
        if: failure()
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "cd ~/app && docker compose -f docker-compose.prod.yml logs --tail=80 backend frontend" || true
